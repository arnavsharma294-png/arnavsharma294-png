<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350"><defs><linearGradient id="bg" x2=".15" y2="1"><stop stop-color="#061613"/><stop offset="1" stop-color="#123b2b"/></linearGradient><radialGradient id="ball" cx=".28" cy=".24" r=".8"><stop stop-color="#ffb3a4"/><stop offset=".38" stop-color="#e7504d"/><stop offset=".8" stop-color="#9a1e29"/><stop offset="1" stop-color="#420b17"/></radialGradient><radialGradient id="lamp"><stop stop-color="#d3ffe9" stop-opacity=".8"/><stop offset="1" stop-color="#a5ffd0" stop-opacity="0"/></radialGradient><linearGradient id="grass" x2="0" y2="1"><stop stop-color="#328554"/><stop offset="1" stop-color="#092e20"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="8"/></filter></defs><style><![CDATA[@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes dash{to{stroke-dashoffset:-100}}@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}.float{animation:float 4s ease-in-out infinite}.trail{animation:dash 3s linear infinite}.glow{animation:glow 3s infinite}.t{font-family:Arial,Helvetica,sans-serif;fill:#edfff3}.m{font-family:monospace;fill:#a5d9b9}@media(prefers-reduced-motion:reduce){*{animation:none!important}}]]></style><rect width="1200" height="350" rx="22" fill="url(#bg)"/><path d="M0 280Q600 100 1200 280V350H0Z" fill="url(#grass)"/><path d="M550 83H650L820 335H380Z" fill="#a7a36e" stroke="#d6d5a3" stroke-width="2"/><path d="M560 105H640L786 326H414Z" fill="#857d51"/><path d="M553 132H647M442 295H758" stroke="#fff8d7" stroke-width="3"/><g stroke="#f7e8b0" stroke-width="5" stroke-linecap="round"><path d="M581 92V44m19 48V44m19 48V44M581 44H619"/><path d="M570 312V248m30 64V248m30 64V248M570 248H630"/></g><path d="M235 280Q450 70 615 124" stroke="#d1ffa0" stroke-width="3" stroke-dasharray="12 12" fill="none" class="trail"/><circle r="15" fill="url(#ball)"><animateMotion dur="3.5s" repeatCount="indefinite" path="M235 280 Q450 70 615 124"/></circle><text x="38" y="57" class="t" font-size="29" font-weight="bold">THE DEVELOPMENT PITCH</text><text x="40" y="87" class="m" font-size="17">Every commit is a delivery.</text><text x="40" y="112" class="m" font-size="17">Every PR moves the game.</text><rect x="850" y="62" width="310" height="170" rx="14" fill="#082b20" stroke="#438963"/><text x="875" y="99" class="m" font-size="18">MATCH STRATEGY</text><text x="875" y="137" class="t" font-size="19">01   Learn consistently</text><text x="875" y="170" class="t" font-size="19">02   Build useful things</text><text x="875" y="203" class="t" font-size="19">03   Contribute upstream</text><rect x="8" y="8" width="1184" height="334" rx="16" fill="none" stroke="#65b78c" opacity=".3"/></svg>