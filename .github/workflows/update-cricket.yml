name: Update cricket profile graphics
on:
  schedule:
    - cron: '21 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate.py'
      - '.github/workflows/update-cricket.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh scoreboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate.py
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scoreboard.svg
          git diff --cached --quiet || (git commit -m "chore: refresh cricket scoreboard" && git push)
